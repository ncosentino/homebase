    # Custom poll (provider: custom):
    question: ""
    cta_label: "Submit Vote"
    options: []
    # options:
    #   - label: "Option A"
    #     value: "a"
    #   - label: "Option B"
    #     value: "b"
    backend: formspree              # For custom polls only: formspree | web3forms
    formspree_id: ""
    web3forms_key: ""
    success_message: "Thanks for your vote!"

  # ── Contact Form ─────────────────────────────────────────────────────────
