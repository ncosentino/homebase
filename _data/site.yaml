# ── Integrations ─────────────────────────────────────────────────────────────
# Each integration is enabled independently. All are opt-in (disabled by default
# in a fresh fork). Configure the ones you want and set enabled: true.
integrations:
  faq:
    enabled: true
    heading: "Frequently Asked Questions"
    items:
      - question: "What programming language and ecosystem does Dev Leader cover?"
        answer: "Dev Leader focuses on C# and .NET, including ASP.NET Core, Entity Framework Core, dependency injection, software architecture patterns, and .NET performance optimization."
      - question: "How can I get started with Dev Leader content?"
        answer: "Start with the Dev Leader YouTube channel at youtube.com/@devleader or subscribe to the free weekly newsletter at weekly.devleader.ca."
      - question: "Does Dev Leader offer 1:1 coaching or consulting?"
        answer: "Yes. Book a session at tidycal.com/nbcosentino for engineering management consulting, career coaching, or software architecture reviews."
      - question: "Who is Dev Leader?"
        answer: "Dev Leader is Nick Cosentino, a Principal Software Engineering Manager at Microsoft and content creator. All views and content are his own and do not represent Microsoft."
      - question: "What is BrandGhost?"
        answer: "BrandGhost is an AI-powered social media management platform co-founded by Nick Cosentino. It is separate from his work at Microsoft and independent of the Dev Leader brand."

  # ── Email Newsletter Signup ──────────────────────────────────────────────
  # Capture emails and send to your newsletter backend of choice.
  # backend options: formspree | convertkit | web3forms | mailchimp_embed | beehiiv_embed | substack
  newsletter:
    enabled: false
    position: after_profile         # after_profile | after_videos | after_links | bottom
    heading: "Join the Newsletter"
    subheading: "Weekly insights. No spam, ever."
    placeholder: "your@email.com"
    cta_label: "Subscribe"
    backend: formspree
    formspree_id: ""                # Formspree form ID — sign up at formspree.io (free tier)
    convertkit_form_id: ""          # Kit (ConvertKit) public form ID
    web3forms_key: ""               # Web3Forms access key — web3forms.com (free tier)
    mailchimp_embed_url: ""         # Mailchimp embedded form action URL
    mailchimp_honey_field: ""       # Mailchimp anti-bot honeypot field name (e.g. b_xxxxxx)
    beehiiv_publication_id: ""      # Beehiiv publication ID (e.g. pub_xxxxx)
    substack_url: ""                # Substack base URL (e.g. https://yourname.substack.com)
    success_message: "You're in! Check your inbox to confirm."
    gdpr_note: ""                   # e.g. "No spam. Unsubscribe anytime."

  # ── Social Follow Buttons ────────────────────────────────────────────────
  # Platform-branded follow buttons with optional subscriber counts.
  # platform values: youtube | github | twitter | x | linkedin | discord | twitch | instagram | tiktok | bluesky | mastodon
  social_follow:
    enabled: false
    position: after_profile
    heading: "Follow Along"
    buttons: []
