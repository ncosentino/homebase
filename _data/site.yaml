  # ── QR Code Widget ───────────────────────────────────────────────────────
  # Generates a real QR code at build time (inline SVG, no runtime JS).
  # URL auto-appends UTM params so QR scans appear as their own channel in GA4.
  qr_code:
    enabled: true
    # Display mode — controls how/where the QR code appears
    # widget:     standalone card at `position` (default)
    # compact:    small card after_profile, no heading
    # flip:       hero banner flips to reveal QR on tap/click (falls back to widget if no banner)
    # sticky:     floating "📱 Scan" button fixed to viewport corner, opens modal overlay
    # badge:      small QR watermarked into a corner of the hero banner (falls back to widget if no banner)
    # sidebyside: hero image + QR card in a flex row (stacks on mobile; falls back to widget if no banner)
    display: flip
    also_sticky: false            # true = always add a floating sticky button alongside the primary mode
    sticky_corner: bottom_right   # bottom_right | bottom_left (for sticky and also_sticky)
    badge_corner: bottom_right    # bottom_right | bottom_left | top_right | top_left (for badge mode)
    badge_size: 80                # QR code size in px for badge overlay
    position: bottom              # after_profile | after_videos | after_links | bottom (widget/compact modes)
    heading: "Scan to Visit"
    label: ""                     # optional sub-label below the QR code
    url: ""                       # leave blank to auto-use site.seo.canonical
    size: 300                     # width/height in px
    show_download: true           # show "Save QR Code" download button
    # Appearance — Dev Leader blue on white, matching page theme
    color: "#4B8FDB"              # dot/module color (matches --bg-color theme blue)
    bg_color: "#ffffff"           # white background (matches card/button bg)
    error_correction: H           # H=30% recoverable — required when using a logo overlay
    margin: 2                     # quiet zone in modules
    logo: "https://github.com/ncosentino.png"  # profile avatar stamped in center
    logo_size: 0                  # logo px size (0 = auto ~30% of size = ~90px)
    # UTM (medium defaults to "qr" regardless of site.utm.medium)
    utm_medium: qr
    utm_source: ""                # blank = inherit from site.utm.source
    utm_campaign: ""              # blank = inherit from site.utm.campaign

  # ── Calendar / Booking Widget ────────────────────────────────────────────
  # Show a booking button or inline calendar embed.
  # provider values: tidycal | calendly | cal
  booking:
    enabled: false
    position: after_links
    heading: "Book a Session"
    subheading: ""
    provider: tidycal
    embed: false                    # true = inline iframe, false = button link only
    url: ""                         # Full booking URL
    cta_label: "Book a Call"
    embed_height: 600               # iframe height in px when embed: true

  # ── Poll / Survey Widget ─────────────────────────────────────────────────
  # Embed a Tally.so form OR define a custom radio-button poll backed by Formspree/Web3Forms.
  # provider values: tally | custom
  poll:
    enabled: false
    position: after_links
    heading: "Quick Poll"
    provider: tally
    tally_form_id: ""               # Tally form ID (from tally.so embed link)
    tally_hide_title: true
