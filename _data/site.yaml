# ─────────────────────────────────────────────────────────────────────────────
# homebase — site configuration
# Fork this repo and edit THIS file to personalize your landing page.
# No code changes needed.
# ─────────────────────────────────────────────────────────────────────────────

# ── Profile ──────────────────────────────────────────────────────────────────
profile:
  name: "Dev Leader"
  username: "@devleader"
  bio: "Principal Software Engineering Manager at Microsoft. Views are my own."
  avatar: "https://github.com/ncosentino.png"
  avatar_url: "https://www.linkedin.com/in/nickcosentino"
  banner: "/assets/thumbnails/banner.jpg"
  banner_url: "https://www.devleader.ca"
  tagline: "Simplifying software engineering concepts for you."
  show_tagline: false
  ai_summary: "Nick Cosentino, known as Dev Leader, is a Principal Software Engineering Manager at Microsoft and a prolific content creator focused on C#, .NET, software architecture, design patterns, and engineering career growth. He publishes a weekly newsletter on devleader.ca, runs multiple YouTube channels and a podcast, and has built a combined audience exceeding 85,000 followers across LinkedIn, YouTube, Substack, and other platforms. Nick is known for making complex software engineering concepts approachable for developers at all levels."
  topics:
    - "C# & .NET"
    - "Software Engineering"
    - "Software Architecture"
    - "Engineering Management"
    - "Open Source"
  show_topics: false
  location: "United States"
  language: "English"
  creator_type: "Content Creator"
  show_badges: false
  contact_url: "https://tidycal.com/nbcosentino/management-and-leadership-consult-30-mins"
  show_contact_cta: false
  # ── Extended bio (SEO) ──────────────────────────────────────────────────
  # A 200–400 word bio rendered as a collapsible block below the social icons.
  # Content lives in the DOM so search engines index it; users who want links
  # fast won't see a wall of text — it's collapsed by default.
  show_extended_bio: true          # Set to true to render the block
  extended_bio_expanded: false     # Set to true to start the block open
  extended_bio_label: ""           # Toggle label. Defaults to "About {name}" if blank.
  extended_bio: |
    Nick Cosentino — known online as Dev Leader — is a Principal Software Engineering Manager at Microsoft, content creator, and co-founder of <a href="https://www.brandghost.ai?utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">BrandGhost</a>, an AI-powered social media management platform built for creators and founders.

    Nick has spent over a decade working across software engineering roles at Microsoft, leading teams and shipping products at scale. Outside of his day job, he has built one of the most recognized C# and .NET education brands online.

    His primary YouTube channel, <a href="https://www.youtube.com/@devleader?sub_confirmation=1&utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">Dev Leader</a>, covers C#, .NET, software architecture, design patterns, dependency injection, performance optimization, and engineering career growth — all with a focus on making complex concepts approachable. Whether you are a junior developer learning the fundamentals or a senior engineer tackling distributed systems, Dev Leader content meets you where you are.

    His second channel, <a href="https://www.youtube.com/channel/UC9KQRiF55bj4as3MV00l-CA?utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">Code Commute</a>, is a long-form conversational show and companion podcast designed for developers on the go. Episodes explore real-world software engineering topics, industry trends, and career advice — the kind of conversations that happen between engineers, not in textbooks.

    In addition to YouTube, Nick publishes a weekly newsletter on <a href="https://weekly.devleader.ca?utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">Substack</a> and runs live coding streams on Twitch and Kick. His writing spans software architecture, C# language features, open source projects, and engineering management.

    <a href="https://www.brandghost.ai?utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">BrandGhost</a> — the platform Nick co-founded — powers the content workflow behind many of the posts you see from Dev Leader. It is built for creators who want to stop manually juggling social media and start growing with AI-assisted scheduling, topic streams, and multi-platform publishing.

    If you are looking to grow as a software engineer, follow the <a href="https://weekly.devleader.ca?utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">Dev Leader newsletter</a> and <a href="https://www.youtube.com/@devleader?sub_confirmation=1&utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">YouTube channel</a>. If you are a creator or founder looking to streamline your content, check out <a href="https://www.brandghost.ai?utm_source=homebase&utm_medium=link&utm_campaign=devleader" target="_blank" rel="noopener">BrandGhost</a>.
  show_total_reach: true
  show_follower_badges: false

# ── SEO ──────────────────────────────────────────────────────────────────────
seo:
  title: "Dev Leader | @devleader"
  description: "Principal Software Engineering Manager at Microsoft. Content creator, educator, and software engineering enthusiast."
  canonical: "https://github.devleader.ca"
  og_image: "https://github.com/ncosentino.png"
  locale: "en_US"
  # Custom domain for GitHub Pages CNAME. Set to your domain (e.g. "links.yoursite.com").
  # Leave blank if using the default youruser.github.io URL (no custom domain).
  cname: "github.devleader.ca"
  keywords:
    - software engineering
    - dotnet
    - csharp
    - microsoft
    - dev leader
    - nick cosentino
  # Used in llms.txt "About" section. Falls back to seo.description if omitted.
  llms_about: "Dev Leader (Nick Cosentino) is a Principal Software Engineering Manager at Microsoft, content creator, and software engineering educator sharing knowledge about software development, C#, .NET, and technology."
  llms_topics:
    - C# and .NET development
    - Software engineering management
    - Dependency injection and software architecture
    - Design patterns
    - Performance optimization
    - Career growth in software engineering
    - Open source development
  llms_content_formats:
    - Blog articles (devleader.ca)
    - Weekly newsletter (Substack)
    - YouTube videos
    - Podcasts (Dev Leader Podcast, Code Commute)
    - Live coding streams (Twitch/Kick)
    - Short-form video (TikTok, Instagram Reels)
  llms_audience: "Software engineers and developers at all levels interested in C#, .NET, software architecture, and engineering career growth. Also targets engineering managers and technical leaders."

  date_created: "2024-01-01T00:00:00.000Z"

  person:
    roles:
      - job_title: "Principal Software Engineering Manager"
        works_for: "Microsoft"
        works_for_url: "https://www.microsoft.com"
      - job_title: "Co-founder"
        works_for: "BrandGhost"
        works_for_url: "https://www.brandghost.ai"
      - job_title: "Content Creator"
        works_for: "Dev Leader"
        works_for_url: "https://www.devleader.ca"
    stats:
      # Enables auto-fetch of follower counts at build time for GitHub, Bluesky, and Mastodon
      # (no API key needed for those). YouTube channels use YOUTUBE_API_KEY secret (see CI).
      # All other platforms use the `followers` field on each social_icons entry.
      auto_fetch: true
    awards:
      - "Microsoft MVP Alumni"
    credentials:
      - name: "Principal Software Engineering Manager at Microsoft"
        url: "https://www.microsoft.com"
        category: "Professional"
    correction_notes:
      - "Nick Cosentino's content and views are his own and do not represent Microsoft or any employer."
      - "BrandGhost is a separate company co-founded by Nick Cosentino. It is not affiliated with Microsoft or the Dev Leader brand."
      - "Dev Leader and Code Commute are Nick Cosentino's personal brands and YouTube channels. All revenue, sponsorships, and products associated with them are independent of his employer."

  recent_content:
    rss_feed: "https://www.devleader.ca/feed"
    max_items: 5

  manifest:
    enabled: true
    theme_color: "#1a1a2e"
    background_color: "#1a1a2e"

# ── UTM Tracking ─────────────────────────────────────────────────────────────
# Page-wide UTM defaults appended to every outbound link.
# Leave utm_source blank to disable UTM tracking entirely.
# Per-link overrides: add a `utm` block on any link to override these defaults.
#
# Example per-link override:
#   - title: "My Course"
#     url: "https://example.com/course"
#     utm:
#       source: "linktree"
#       medium: "referral"
#       campaign: "course-launch"
#       content: "banner"          # optional
#       term: ""                   # optional
utm:
  source: "homebase"
  medium: "link"
  campaign: "devleader"
  content: ""
  term: ""

# ── Analytics ────────────────────────────────────────────────────────────────
# Event name sent to GA for every link click. Choose this once — GA cannot
# rename historical events, so changing it later starts a new data series.
ga_event_name: "creator_link_click"

# Per-link label override: add `ga_label` to any link in sections[] to control
# the "destination" value recorded in GA. Useful when a link title changes
# seasonally but you want a stable key in your reports.
#
# Example:
#   sections:
#     - links:
#         - title: "My Course (Spring Sale!)"
#           url: "https://example.com/course"
#           ga_label: "course"   # GA records "course", not the full title

# ── Theme ────────────────────────────────────────────────────────────────────
theme: devleader

# ── Embeds ───────────────────────────────────────────────────────────────────
embeds:
  # Option A — Pull latest video(s) live from YouTube channels at build time.
  # channel_id: the UC... ID from youtube.com/@handle/about (see RSS link)
  # max_videos: how many latest videos to show per channel (default: 1)
  # Subscriber counts are NOT stored here — add a socials entry with channel_id instead.
  youtube_channels:
    - channel_id: "UCJ90Is0z9KIyNSufH--IwRg"
      name: "Dev Leader"
      max_videos: 1
    - channel_id: "UC9KQRiF55bj4as3MV00l-CA"
      name: "Code Commute"
      max_videos: 1
    - channel_id: "UCGwW7g70QUMZhSHMyRWnVTQ"
      name: "Dev Leader: Path to Tech"
      max_videos: 1
    - channel_id: "UCg5QzmZnkjKzTXlGZTG4NhQ"
      name: "The Dev Leader Podcast"
      max_videos: 1

# Option B — Hard-code specific videos. Used as fallback if embeds.youtube_channels
# is empty or omitted. Leave both empty to hide the video section entirely.
featured_videos: []

