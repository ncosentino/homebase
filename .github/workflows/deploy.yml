name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── TEMPLATE CONFIGURATION ────────────────────────────────────────────────────
# Deploys to Cloudflare Pages via Wrangler direct upload (see docs/cicd.md).
# Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and GOOGLE_ANALYTICS_ID as repo
# secrets, set `name` in wrangler.toml, and set HOMEBASE_DEPLOY_ENABLED=true as
# a repository variable.
# ──────────────────────────────────────────────────────────────────────────────

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate generated metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test generated metadata
        run: npm test

  production:
    name: Build & deploy (production)
    needs: [quality]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout homebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system fonts
        run: sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        if: vars.HOMEBASE_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy _site --branch=${{ github.ref_name }}

  preview:
    name: Build & deploy (preview)
    needs: [quality]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout homebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system fonts
        run: sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
        run: npm run build

      # gitHubToken lets Wrangler attach the preview URL to the pull request.
      - name: Deploy to Cloudflare Pages (preview)
        if: >-
          vars.HOMEBASE_DEPLOY_ENABLED == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy _site --branch=${{ github.head_ref }}

  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    needs: [quality, production]
    # Pull requests build docs independently because production is intentionally
    # skipped there. Main/manual docs wait for the production build job to pass.
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (github.event_name == 'pull_request' || needs.production.result == 'success')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Generate articles page
        run: python scripts/generate-articles.py docs/articles.md

      - name: Build documentation
        run: python -m mkdocs build

      - name: Verify documentation origin indexing policy
        run: |
          grep -Fqx 'https://:project.pages.dev/*' site/_headers
          grep -Fqx 'https://:version.:project.pages.dev/*' site/_headers
          test "$(grep -Fxc '  X-Robots-Tag: noindex' site/_headers)" -eq 2

      - name: Deploy documentation (Cloudflare Pages)
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          vars.HOMEBASE_DOCS_PROJECT_NAME != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.HOMEBASE_DOCS_PROJECT_NAME }} --branch=main
